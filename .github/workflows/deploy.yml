# Выкладка игры на GitHub Pages — только вручную: вкладка Actions → «Deploy game» → «Run workflow».
# Push в main сам ничего не выкладывает. Подробности — tools/deploy.md.
name: Deploy game

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Два запуска подряд не перебивают друг друга: второй ждёт первого.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
